openapi: 3.0.3
info:
  title: API de Pedidos — Cozinha de Comida Saudável
  description: >
    API REST para uma atendente registrar pedidos de uma cozinha de comida
    saudável e acompanhar o preparo até a entrega. A partir da versão 2.0.0,
    a API exige autenticação (Bearer JWT) em todos os endpoints, exceto
    `POST /auth/login` e `GET /health`. A partir da versão 2.1.0, requisições
    com método não suportado numa rota existente respondem `405` (com o
    header `Allow`), e requisições para rotas inexistentes respondem `404`
    — em ambos os casos **sem exigir autenticação**, já que essas respostas
    descrevem o recurso, não o solicitante.
  version: 2.1.0

servers:
  - url: http://localhost:2000
    description: Ambiente local

tags:
  - name: Autenticação
  - name: Pedidos
  - name: Sistema

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica um usuário e retorna um token
      description: >
        Endpoint público. Recebe usuário e senha e devolve um JWT válido por
        1 hora, assinado com `JWT_SECRET`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              usuario: pamela
              senha: "1234"
      responses:
        '200':
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJwYW1lbGEiLCJpYXQiOjE3NTQ0NTA0MDAsImV4cCI6MTc1NDQ1NDAwMH0.assinatura"
                expiraEm: "2026-08-06T02:00:00.000Z"
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: VALIDACAO
                  mensagem: "Payload inválido."
                  detalhes:
                    - campo: usuario
                      problema: "Campo obrigatório."
        '401':
          description: Usuário ou senha inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: CREDENCIAIS_INVALIDAS
                  mensagem: "Usuário ou senha inválidos."
                  detalhes: []
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /pedidos:
    post:
      tags: [Pedidos]
      summary: Cria um novo pedido
      description: >
        Cria um pedido com um ou mais itens. O pedido nasce sempre com status
        `RECEBIDO`. O `valorTotal` é sempre calculado no servidor a partir dos
        itens — qualquer `valorTotal` enviado no corpo é ignorado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoInput'
            example:
              cliente: "Maria Souza"
              observacao: "Sem cebola"
              itens:
                - nome: "Bowl de quinoa"
                  quantidade: 2
                  precoUnitario: 28.90
                - nome: "Suco verde"
                  quantidade: 1
                  precoUnitario: 12.50
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
              example:
                id: 1
                cliente: "Maria Souza"
                observacao: "Sem cebola"
                status: RECEBIDO
                valorTotal: 70.30
                criadoEm: "2026-08-04T13:00:00.000Z"
                atualizadoEm: "2026-08-04T13:00:00.000Z"
                itens:
                  - id: 1
                    nome: "Bowl de quinoa"
                    quantidade: 2
                    precoUnitario: 28.90
                  - id: 2
                    nome: "Suco verde"
                    quantidade: 1
                    precoUnitario: 12.50
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: VALIDACAO
                  mensagem: "Payload inválido."
                  detalhes:
                    - campo: "cliente"
                      problema: "Campo obrigatório."
                    - campo: "itens[0].quantidade"
                      problema: "Deve ser um inteiro maior ou igual a 1."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInterno'

    get:
      tags: [Pedidos]
      summary: Lista pedidos
      description: Lista todos os pedidos, com filtro opcional por status.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StatusPedido'
          description: Filtra os pedidos pelo status informado.
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '400':
          description: Status de filtro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: STATUS_INVALIDO
                  mensagem: "Status 'FINALIZADO' não é válido."
                  detalhes: []
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /pedidos/resumo:
    get:
      tags: [Pedidos]
      summary: Resumo de pedidos por status
      description: Retorna a contagem de pedidos agrupada por cada status.
      responses:
        '200':
          description: Contagem por status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoPedidos'
              example:
                RECEBIDO: 2
                EM_PREPARO: 1
                PRONTO: 1
                ENTREGUE: 1
                CANCELADO: 1
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /pedidos/{id}:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    get:
      tags: [Pedidos]
      summary: Busca um pedido pelo id
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: PEDIDO_NAO_ENCONTRADO
                  mensagem: "Pedido 42 não existe."
                  detalhes: []
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInterno'

    patch:
      tags: [Pedidos]
      summary: Edita cliente, observação e/ou itens de um pedido
      description: >
        Altera parcialmente `cliente`, `observacao` e/ou `itens` de um
        pedido. Todos os campos são opcionais, mas o corpo não pode vir
        vazio. Campos fora deste contrato (`status`, `id`, `valorTotal`,
        `criadoEm`, `atualizadoEm`) são ignorados se enviados — este
        endpoint não altera o status; para isso use
        `PATCH /pedidos/{id}/status`. Quando `itens` é enviado, ele substitui
        a lista inteira e o `valorTotal` é recalculado no servidor, pela
        mesma regra do `POST /pedidos`. Só é permitido com o pedido em
        `RECEBIDO` ou `EM_PREPARO`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPedidoInput'
            example:
              cliente: "Maria Souza Andrade"
              observacao: "Sem cebola, capricha na pimenta"
      responses:
        '200':
          description: Pedido atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
              example:
                id: 1
                cliente: "Maria Souza Andrade"
                observacao: "Sem cebola, capricha na pimenta"
                status: RECEBIDO
                valorTotal: 70.30
                criadoEm: "2026-08-04T13:00:00.000Z"
                atualizadoEm: "2026-08-04T13:20:00.000Z"
                itens:
                  - id: 1
                    nome: "Bowl de quinoa"
                    quantidade: 2
                    precoUnitario: 28.90
                  - id: 2
                    nome: "Suco verde"
                    quantidade: 1
                    precoUnitario: 12.50
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: VALIDACAO
                  mensagem: "Payload inválido."
                  detalhes:
                    - campo: "(raiz)"
                      problema: "Corpo não pode ser vazio."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: PEDIDO_NAO_ENCONTRADO
                  mensagem: "Pedido 42 não existe."
                  detalhes: []
        '409':
          description: Pedido não pode ser editado no status atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: TRANSICAO_INVALIDA
                  mensagem: "Pedido 42 está PRONTO e não pode ser editado."
                  detalhes: []
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInterno'

    delete:
      tags: [Pedidos]
      summary: Cancela um pedido
      description: >
        Cancela o pedido (transição para `CANCELADO`). Pedidos `ENTREGUE` ou já
        `CANCELADO` não podem ser cancelados.
      responses:
        '200':
          description: Pedido cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: PEDIDO_NAO_ENCONTRADO
                  mensagem: "Pedido 42 não existe."
                  detalhes: []
        '409':
          description: Pedido não pode ser cancelado no status atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: TRANSICAO_INVALIDA
                  mensagem: "Pedido 42 já está ENTREGUE e não pode ser cancelado."
                  detalhes: []
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /pedidos/{id}/status:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    patch:
      tags: [Pedidos]
      summary: Avança ou retrocede o status do pedido
      description: >
        Avança uma casa (`RECEBIDO → EM_PREPARO → PRONTO → ENTREGUE`) ou
        retrocede uma casa. `ENTREGUE` é estado final e não avança nem
        retrocede.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcaoStatusInput'
            example:
              acao: AVANCAR
      responses:
        '200':
          description: Pedido com status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          description: Ação inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: VALIDACAO
                  mensagem: "Payload inválido."
                  detalhes:
                    - campo: "acao"
                      problema: "Deve ser 'AVANCAR' ou 'RETROCEDER'."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          description: Pedido não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: PEDIDO_NAO_ENCONTRADO
                  mensagem: "Pedido 42 não existe."
                  detalhes: []
        '409':
          description: Transição de status não permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                erro:
                  codigo: TRANSICAO_INVALIDA
                  mensagem: "Pedido 42 está ENTREGUE e não pode avançar."
                  detalhes: []
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInterno'

  /health:
    get:
      tags: [Sistema]
      summary: Verifica se a API está no ar
      description: >
        Endpoint público. Verifica de fato a conexão com o banco (`SELECT 1`),
        com tempo limite de 2 segundos.
      security: []
      responses:
        '200':
          description: API saudável
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                dependencias:
                  - nome: persistencia
                    ok: true
        '503':
          description: Dependência indisponível ou fora do tempo limite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: indisponivel
                dependencias:
                  - nome: persistencia
                    ok: false
                    detalhe: "Tempo limite de 2000ms excedido."
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInterno'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PedidoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        example: 1
      description: Id do pedido

  responses:
    NaoAutenticado:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
          example:
            erro:
              codigo: NAO_AUTENTICADO
              mensagem: "Não autenticado."
              detalhes: []

    ErroInterno:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
          example:
            erro:
              codigo: ERRO_INTERNO
              mensagem: "Erro interno do servidor."
              detalhes: []

    MetodoNaoPermitido:
      description: >
        Método HTTP não suportado nesta rota. Resolvido antes da verificação
        de autenticação — não exige token.
      headers:
        Allow:
          description: Métodos aceitos nesta rota, separados por vírgula.
          schema:
            type: string
            example: "GET, HEAD, POST, OPTIONS"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
          example:
            erro:
              codigo: METODO_NAO_PERMITIDO
              mensagem: "Método PUT não é permitido em /pedidos."
              detalhes: []

  schemas:
    StatusPedido:
      type: string
      enum: [RECEBIDO, EM_PREPARO, PRONTO, ENTREGUE, CANCELADO]

    AcaoStatus:
      type: string
      enum: [AVANCAR, RETROCEDER]

    AcaoStatusInput:
      type: object
      required: [acao]
      properties:
        acao:
          $ref: '#/components/schemas/AcaoStatus'

    LoginInput:
      type: object
      required: [usuario, senha]
      properties:
        usuario:
          type: string
          example: pamela
        senha:
          type: string
          format: password
          example: "1234"

    LoginResponse:
      type: object
      required: [token, expiraEm]
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJwYW1lbGEiLCJpYXQiOjE3NTQ0NTA0MDAsImV4cCI6MTc1NDQ1NDAwMH0.assinatura"
        expiraEm:
          type: string
          format: date-time
          example: "2026-08-06T02:00:00.000Z"

    ItemPedidoInput:
      type: object
      required: [nome, quantidade, precoUnitario]
      properties:
        nome:
          type: string
          maxLength: 120
          example: "Bowl de quinoa"
        quantidade:
          type: integer
          minimum: 1
          example: 2
        precoUnitario:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 28.90

    ItemPedido:
      type: object
      required: [id, nome, quantidade, precoUnitario]
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: "Bowl de quinoa"
        quantidade:
          type: integer
          example: 2
        precoUnitario:
          type: number
          format: double
          example: 28.90

    PedidoInput:
      type: object
      required: [cliente, itens]
      properties:
        cliente:
          type: string
          minLength: 1
          maxLength: 120
          example: "Maria Souza"
        observacao:
          type: string
          maxLength: 280
          nullable: true
          example: "Sem cebola"
        itens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemPedidoInput'

    PatchPedidoInput:
      type: object
      description: >
        Alteração parcial do pedido. Todos os campos são opcionais, mas o
        corpo não pode ser enviado vazio. Campos fora deste contrato
        (`status`, `id`, `valorTotal`, `criadoEm`, `atualizadoEm`) são
        ignorados se enviados.
      minProperties: 1
      properties:
        cliente:
          type: string
          minLength: 1
          maxLength: 120
          example: "Maria Souza Andrade"
        observacao:
          type: string
          maxLength: 280
          nullable: true
          example: "Sem cebola, capricha na pimenta"
        itens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemPedidoInput'

    Pedido:
      type: object
      required:
        - id
        - cliente
        - observacao
        - status
        - valorTotal
        - criadoEm
        - atualizadoEm
        - itens
      properties:
        id:
          type: integer
          example: 1
        cliente:
          type: string
          example: "Maria Souza"
        observacao:
          type: string
          nullable: true
          example: "Sem cebola"
        status:
          $ref: '#/components/schemas/StatusPedido'
        valorTotal:
          type: number
          format: double
          example: 70.30
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedido'

    ResumoPedidos:
      type: object
      description: Contagem de pedidos por status.
      required: [RECEBIDO, EM_PREPARO, PRONTO, ENTREGUE, CANCELADO]
      properties:
        RECEBIDO:
          type: integer
          example: 2
        EM_PREPARO:
          type: integer
          example: 1
        PRONTO:
          type: integer
          example: 1
        ENTREGUE:
          type: integer
          example: 1
        CANCELADO:
          type: integer
          example: 1

    Dependencia:
      type: object
      required: [nome, ok]
      properties:
        nome:
          type: string
          example: persistencia
        ok:
          type: boolean
          example: true
        detalhe:
          type: string
          description: Só é preenchido fora de produção (`NODE_ENV=production` usa texto genérico).
          example: "Tempo limite de 2000ms excedido."

    HealthResponse:
      type: object
      required: [status, dependencias]
      properties:
        status:
          type: string
          enum: [ok, indisponivel]
          example: ok
        dependencias:
          type: array
          items:
            $ref: '#/components/schemas/Dependencia'

    ErroDetalhe:
      type: object
      required: [campo, problema]
      properties:
        campo:
          type: string
          example: "cliente"
        problema:
          type: string
          example: "Campo obrigatório."

    ErroResponse:
      type: object
      required: [erro]
      properties:
        erro:
          type: object
          required: [codigo, mensagem, detalhes]
          properties:
            codigo:
              type: string
              example: "PEDIDO_NAO_ENCONTRADO"
            mensagem:
              type: string
              example: "Pedido 42 não existe."
            detalhes:
              type: array
              items:
                $ref: '#/components/schemas/ErroDetalhe'
